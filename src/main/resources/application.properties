spring.application.name=conectorpedidoscompra

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production enviroments (Default)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Development enviroments (Erase in prod or change)
#update (To not erase the database) or create-drop (To integration test)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


